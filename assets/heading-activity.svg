<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44">
  <title>A little activity pulse</title>
  <style>
    :root{color-scheme:light dark;--panel:#f3edfc;--edge:#dfd0ef;--ink:#9468bf;--track:#ceb9df}
    @media(prefers-color-scheme:dark){:root{--panel:#292237;--edge:#58436d;--ink:#dfb9eb;--track:#6b507f}}
    .signal{stroke-dasharray:11 40;animation:signal 3.8s linear infinite}.dot{animation:ping 3.8s ease-in-out infinite}
    @keyframes signal{to{stroke-dashoffset:-51}}
    @keyframes ping{0%,100%{opacity:.3}40%,60%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.signal,.dot{animation:none}.signal{stroke-dasharray:none}}
  </style>
  <rect x="1" y="1" width="30" height="30" rx="10" fill="var(--panel)" stroke="var(--edge)"/>
  <path d="M7 10h12M7 24h18" fill="none" stroke="var(--edge)" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M5 18h5l3-7 5 12 3-7h6" fill="none" stroke="var(--track)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="signal" d="M5 18h5l3-7 5 12 3-7h6" pathLength="51" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot" cx="24" cy="9" r="2" fill="#d39aba"/>
</svg>
