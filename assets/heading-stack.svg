<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44">
  <title>Layers in motion</title>
  <style>
    :root{color-scheme:light dark;--panel:#f3edfc;--edge:#dfd0ef;--ink:#9162b8;--top:#dbc5f0}
    @media(prefers-color-scheme:dark){:root{--panel:#292237;--edge:#58436d;--ink:#ddc0f4;--top:#806098}}
    .layer{animation:lift 5.2s ease-in-out infinite}.middle{animation-delay:-.22s}.top{animation-delay:-.44s}
    @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @media(prefers-reduced-motion:reduce){.layer{animation:none}}
  </style>
  <rect x="1" y="1" width="30" height="30" rx="10" fill="var(--panel)" stroke="var(--edge)"/>
  <g stroke="var(--ink)" stroke-width="1.05" stroke-linejoin="round">
    <path class="layer" d="M6 21l10-5 10 5-10 5Z" fill="#bd9ac8"/>
    <path class="layer middle" d="M6 16l10-5 10 5-10 5Z" fill="var(--panel)"/>
    <g class="layer top"><path d="M6 11l10-5 10 5-10 5Z" fill="var(--top)"/><path d="M13 11l3-1.5 3 1.5-3 1.5Z" fill="#f1dfef" stroke="none"/></g>
  </g>
</svg>
