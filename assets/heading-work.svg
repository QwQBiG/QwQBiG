<svg xmlns="http://www.w3.org/2000/svg" width="32" height="44" viewBox="0 0 32 44">
  <title>Projects with a little sparkle</title>
  <style>
    :root{color-scheme:light dark;--panel:#f3edfc;--edge:#dfd0ef;--ink:#9162b8;--card:#ddc9f1}
    @media(prefers-color-scheme:dark){:root{--panel:#292237;--edge:#58436d;--ink:#ddc0f4;--card:#74538f}}
    .card{animation:float 4.8s ease-in-out infinite}.star{transform-origin:23px 10px;animation:star 4.8s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(1px)}50%{transform:translateY(-1px)}}
    @keyframes star{0%,100%{transform:scale(.8) rotate(-12deg);opacity:.6}50%{transform:scale(1.1) rotate(12deg);opacity:1}}
    @media(prefers-reduced-motion:reduce){.card,.star{animation:none}}
  </style>
  <rect x="1" y="1" width="30" height="30" rx="10" fill="var(--panel)" stroke="var(--edge)"/>
  <g class="card" stroke="var(--ink)" stroke-width="1.1" stroke-linejoin="round">
    <rect x="6" y="11" width="15" height="14" rx="2.5" fill="var(--card)" transform="rotate(-8 13 18)" opacity=".55"/>
    <rect x="9" y="8" width="15" height="15" rx="2.5" fill="var(--panel)"/>
    <path d="M12 17h8m-8 3h5" stroke-linecap="round"/>
  </g>
  <path class="star" d="M23 4q1 5 6 6-5 1-6 6-1-5-6-6 5-1 6-6Z" fill="#ca91bd"/>
</svg>
