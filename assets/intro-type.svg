<svg xmlns="http://www.w3.org/2000/svg" width="520" height="104" viewBox="0 0 520 104" role="img" aria-labelledby="intro-title intro-desc">
  <title id="intro-title">Currently in orbit — building useful little things.</title>
  <desc id="intro-desc">Building useful little things. From systems to playful pixels. Open source, always in motion. Three rotating lines about making useful, playful open-source projects.</desc>
  <style>
    :root { color-scheme: light dark; --ink: #7553a2; --muted: #83748f; --accent: #a08bc6; --track: #b6a6c8; }
    text { font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
    .eyebrow { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 2px; }
    .phrase { opacity: 0; animation: phrase-cycle 18s linear infinite; transform-box: fill-box; }
    .phrase text { fill: var(--ink); font-size: 25px; font-weight: 600; letter-spacing: -.5px; }
    .reveal { animation: type-reveal 18s steps(30, end) infinite; }
    .second, .second .reveal { animation-delay: 6s; }
    .third, .third .reveal { animation-delay: 12s; }
    .cursor { fill: var(--accent); animation: cursor-blink 1.1s steps(1, end) infinite; }
    .orbit { fill: none; stroke: var(--track); stroke-width: 1; opacity: .32; }
    .progress { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 32 428; animation: drift 6s ease-in-out infinite; opacity: .8; }
    .star { fill: var(--accent); opacity: .6; animation: glimmer 4s ease-in-out infinite; }
    @keyframes phrase-cycle {
      0%, 1% { opacity: 0; transform: translateY(4px); }
      3%, 29% { opacity: 1; transform: translateY(0); }
      32%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes type-reveal {
      0% { clip-path: inset(0 100% 0 0); }
      16%, 32% { clip-path: inset(0 0 0 0); }
      33%, 100% { clip-path: inset(0 100% 0 0); }
    }
    @keyframes cursor-blink { 0%, 49% { opacity: .85; } 50%, 100% { opacity: 0; } }
    @keyframes drift { 0% { stroke-dashoffset: 32; opacity: 0; } 12%, 82% { opacity: .8; } 100% { stroke-dashoffset: -428; opacity: 0; } }
    @keyframes glimmer { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #cfb7ef; --muted: #b1a0c2; --accent: #bca0e6; --track: #aa8bc7; }
    }
    @media (prefers-reduced-motion: reduce) {
      .phrase, .reveal, .cursor, .progress, .star { animation: none !important; }
      .first { opacity: 1; transform: none; }
      .first .reveal { clip-path: none; }
      .second, .third, .cursor, .progress { display: none; }
    }
  </style>
  <text class="eyebrow" x="2" y="16">CURRENTLY IN ORBIT</text>
  <g class="phrase first">
    <g class="reveal">
      <text x="2" y="54">Building useful little things.</text>
      <rect class="cursor" x="315" y="34" width="2" height="24" rx="1"/>
    </g>
  </g>
  <g class="phrase second">
    <g class="reveal">
      <text x="2" y="54">From systems to playful pixels.</text>
      <rect class="cursor" x="354" y="34" width="2" height="24" rx="1"/>
    </g>
  </g>
  <g class="phrase third">
    <g class="reveal">
      <text x="2" y="54">Open source, always in motion.</text>
      <rect class="cursor" x="359" y="34" width="2" height="24" rx="1"/>
    </g>
  </g>
  <path class="orbit" d="M2 82H462"/>
  <path class="progress" d="M2 82H462"/>
  <path class="orbit" d="M447 73c27-12 60-9 66 0s-18 22-47 20"/>
  <path class="star" d="m486 76 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
</svg>
